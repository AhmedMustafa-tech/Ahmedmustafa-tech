<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#FF4D8D"/><stop offset="1" stop-color="#FF9F43"/></linearGradient>
    <radialGradient id="o1" cx="85%" cy="10%" r="55%"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2" cx="70%" cy="90%" r="45%"><stop offset="0" stop-color="#FF4D8D" stop-opacity=".35"/><stop offset="1" stop-color="#FF4D8D" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'SFMono-Regular',Menlo,Consolas,monospace}
      @keyframes flow{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .wire{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
      .dot{animation:pulse 2s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#08080A"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="24" fill="url(#o1)"/>
  <rect width="1200" height="320" rx="24" fill="url(#o2)"/>
  <g transform="translate(60,56)">
    <rect width="300" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".15"/>
    <circle cx="20" cy="17" r="5" fill="#34D399" class="dot"/>
    <text x="34" y="22" class="t" font-size="15" fill="#D4D4D8">Available for IT automation projects</text>
    <text y="104" class="t" font-size="54" font-weight="700" fill="#F4F4F5" letter-spacing="-1.5">Ahmed Mohamed</text>
    <text y="148" class="t" font-size="24" fill="url(#g)" font-weight="600">IT Operations &amp; Automation Engineer</text>
    <text y="186" class="t" font-size="17" fill="#A1A1AA">I automate the busywork out of IT: SLA follow-up, onboarding, offboarding, reporting.</text>
  </g>
  <g transform="translate(60,272)" class="m" font-size="13">
    <rect width="112" height="30" rx="8" fill="#141419" stroke="#ffffff" stroke-opacity=".14"/><text x="56" y="20" text-anchor="middle" fill="#F4F4F5">Jira SM</text>
    <path d="M118 15h28" stroke="#FF4D8D" class="wire"/>
    <rect x="152" width="80" height="30" rx="8" fill="#141419" stroke="#ffffff" stroke-opacity=".14"/><text x="192" y="20" text-anchor="middle" fill="#F4F4F5">n8n</text>
    <path d="M238 15h28" stroke="#FF4D8D" class="wire"/>
    <rect x="272" width="90" height="30" rx="8" fill="#141419" stroke="#C4B5FD" stroke-opacity=".6"/><text x="317" y="20" text-anchor="middle" fill="#E9D5FF">GPT</text>
    <path d="M368 15h28" stroke="#FF4D8D" class="wire"/>
    <rect x="402" width="84" height="30" rx="8" fill="#141419" stroke="#ffffff" stroke-opacity=".14"/><text x="444" y="20" text-anchor="middle" fill="#F4F4F5">Slack</text>
    <path d="M492 15h28" stroke="#FF4D8D" class="wire"/>
    <rect x="526" width="118" height="30" rx="8" fill="#141419" stroke="#34D399" stroke-opacity=".6"/><text x="585" y="20" text-anchor="middle" fill="#A7F3D0">Done ✓</text>
  </g>
  <g transform="translate(870,70)" class="t">
    <rect width="270" height="190" rx="18" fill="#111115" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="16" y="16" width="30" height="30" rx="9" fill="url(#g)"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" class="m">A</text>
    <text x="56" y="36" font-size="14" font-weight="600" fill="#F4F4F5">Atlas</text><text x="100" y="36" font-size="12" fill="#6B6B76">10:02</text>
    <text x="16" y="72" font-size="13" fill="#D4D4D8">Heads-up: ticket close to SLA.</text>
    <rect x="16" y="86" width="238" height="48" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="16" y="86" width="3" height="48" fill="#FBBF24"/>
    <text x="28" y="106" font-size="13" font-weight="600" fill="#F4F4F5">Laptop not charging</text>
    <text x="28" y="124" font-size="11.5" fill="#A1A1AA">In progress · assigned to you</text>
    <rect x="16" y="146" width="76" height="26" rx="7" fill="#F4F4F5"/><text x="54" y="163" text-anchor="middle" font-size="11.5" font-weight="600" fill="#08080A">Summary</text>
    <rect x="100" y="146" width="84" height="26" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".2"/><text x="142" y="163" text-anchor="middle" font-size="11.5" fill="#E4E4E7">Next action</text>
  </g>
</svg>
